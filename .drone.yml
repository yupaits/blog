kind: pipeline
type: docker
name: 构建站点文件

clone:
  disable: true

steps:
  - name: 拉取代码
    image: alpine/git:2.47.2
    extra_hosts:
      - "gitea.yupaits.top:192.168.2.3"
    commands:
      # 全量克隆保留 git 历史：lastUpdated 依赖提交时间
      - git clone https://gitea.yupaits.top/yupaits/blog-md.git .

  # CI 构建镜像 yupaits/blog-md-ci:node24（node:24-alpine + git + pnpm@12.18.0，见 docker/ci/Dockerfile）
  # 按 Dockerfile 内容的短哈希打标签：本地已有该哈希就跳过构建，只补 node24 别名。
  # 使用固定版本 tag（不用 docker:cli 这类可变 tag），宿主机需预置该镜像：
  # docker pull docker:29.9.3-cli
  # 缺失时 Drone 仍会去 registry 拉取（国内可能卡住）；if-not-exists 保证缓存命中后不再重复拉取。
  - name: 构建镜像
    image: docker:29.9.3-cli
    pull: if-not-exists
    depends_on:
      - 拉取代码
    volumes:
      # 复用宿主机 Docker daemon：构建出的镜像对 runner 与后续 step 可见
      - name: docker_sock
        path: /var/run/docker.sock
    commands:
      - TAG=yupaits/blog-md-ci:node24
      - HASH="yupaits/blog-md-ci:$(sha256sum docker/ci/Dockerfile | cut -c1-12)"
      - |
        if docker image inspect "$HASH" >/dev/null 2>&1; then
          echo "[ci-image] 跳过：本地已存在 $HASH，本次不重建"
          docker tag "$HASH" "$TAG"
        else
          echo "[ci-image] 构建：本地缺少 $HASH，开始 docker build"
          # 上下文收窄到 docker/ci：Dockerfile 无 COPY/ADD，不需要整个仓库
          docker build -f docker/ci/Dockerfile -t "$HASH" -t "$TAG" docker/ci
        fi

  # 镜像由上一 step 构建并打好 node24 别名，这里绝不访问 registry
  - name: pnpm构建
    image: yupaits/blog-md-ci:node24
    depends_on:
      - 构建镜像
    pull: never
    volumes:
      # pnpm 全局 store：跨构建复用已下载的包
      - name: cache
        path: /.pnpm-store
      # VitePress 依赖预打包缓存 + 图片优化清单 image-manifest.json
      - name: vp-cache
        path: /drone/src/docs/.vitepress/cache
      # 图片压缩产物：配合清单里的 mtime 判定做增量转码
      - name: images-opt
        path: /drone/src/docs/public/images-opt
      # 站点产物发布目录，宿主机上的 web 服务直接指向这里
      - name: dist
        path: /drone/src/docs/.vitepress/dist
    commands:
      - pnpm config set store-dir /.pnpm-store
      - pnpm install --frozen-lockfile
      - pnpm run check:links
      - pnpm run check:assets
      - pnpm run docs:build
      - pnpm run check:bundle

volumes:
  - name: cache
    host:
      path: /volume3/docker/dev/drone/pnpm/cache
  - name: vp-cache
    host:
      path: /volume3/docker/dev/drone/yupaits-notes-vp-cache
  - name: images-opt
    host:
      path: /volume3/docker/dev/drone/yupaits-notes-images-opt
  - name: dist
    host:
      path: /volume3/docker/dev/drone/yupaits-notes
  # 宿主机 Docker socket，仅供「构建镜像」step 使用
  - name: docker_sock
    host:
      path: /var/run/docker.sock
